# Project-wide Gradle settings.
# See http://www.gradle.org/docs/current/userguide/build_environment.html

# AndroidX - WAJIB untuk semua library modern
android.useAndroidX=true

# Jetifier: auto-migrate support library ke AndroidX
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Non-transitive R class (better build perf on larger projects)
android.nonTransitiveRClass=true
